name: Build SNX Mockups APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SNX_Mockups_v0.4_Android_Project.zip'
      - 'android-patches/styles.xml'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip SNX_Mockups_v0.4_Android_Project.zip -d project

      - name: Add missing app theme resource
        run: |
          mkdir -p project/app/src/main/res/values
          cp android-patches/styles.xml project/app/src/main/res/values/styles.xml

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNX-Mockups-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
