# Build the Play Store release bundle and a test APK.
name: Build SNX Mockups
on:
  workflow_dispatch:
  push:
    paths:
      - 'SNX_Mockups_v1.3_3D_Rendering_Upgrade.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SNX_KEYSTORE_BASE64: ${{ secrets.SNX_KEYSTORE_BASE64 }}
      SNX_KEYSTORE_PASSWORD: ${{ secrets.SNX_KEYSTORE_PASSWORD }}
      SNX_KEY_ALIAS: ${{ secrets.SNX_KEY_ALIAS }}
      SNX_KEY_PASSWORD: ${{ secrets.SNX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-36,build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android project
        run: unzip -o SNX_Mockups_v1.3_3D_Rendering_Upgrade.zip -d project
      - name: Configure upload key (optional)
        if: ${{ env.SNX_KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$SNX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snx-upload.jks"
          echo "SNX_KEYSTORE_FILE=$RUNNER_TEMP/snx-upload.jks" >> "$GITHUB_ENV"
      - name: Build test APK and Play bundle
        working-directory: project
        run: gradle --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SNX-Mockups-v1.3-builds
          path: |
            project/app/build/outputs/apk/debug/*.apk
            project/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
