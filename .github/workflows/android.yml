name: Build SNX Mockups APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack phone build kit and Android project
        run: |
          test -f SNX_Mockups_v0.2_Phone_Build_Kit.zip
          mkdir -p build-kit android-project
          unzip -q SNX_Mockups_v0.2_Phone_Build_Kit.zip -d build-kit
          PROJECT_ZIP="$(find build-kit -type f -name 'SNX_Mockups_v0.2_Android_Project.zip' -print -quit)"
          test -n "$PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNX-Mockups-debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
