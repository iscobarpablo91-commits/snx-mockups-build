
name: Build SNX Mockups APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ZIP: SNX_Mockups_v0.2_Android_Project.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: |
          test -f "$PROJECT_ZIP"
          mkdir -p android-project
          unzip -q "$PROJECT_ZIP" -d android-project

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SNX-Mockups-debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
